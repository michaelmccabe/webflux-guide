openapi: 3.0.3
info:
  title: Payment Service API
  version: 1.0.0
  description: High-performance, reactive Web API for managing payments using Spring Boot WebFlux, R2DBC, and PostgreSQL.
paths:
  /api/payments:
    post:
      tags:
        - Payments
      summary: Create a new payment
      description: Persists a new payment record and returns the created payment details.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
    get:
      tags:
        - Payments
      summary: Search and filter payments
      description: Retrieves a stream of payments based on dynamic search criteria such as date range, amount, and status.
      operationId: findPayments
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: amount
          in: query
          required: false
          schema:
            type: number
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
  /api/payments/{id}:
    get:
      tags:
        - Payments
      summary: Get a payment by ID
      description: Retrieves a payment record by its unique ID.
      operationId: getPaymentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
    put:
      tags:
        - Payments
      summary: Update an existing payment
      description: Modifies an existing payment record and returns the updated details.
      operationId: updatePayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
    delete:
      tags:
        - Payments
      summary: Delete a payment
      description: Deletes a payment record by its unique ID.
      operationId: deletePayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
components:
  schemas:
    PaymentRequest:
      type: object
      required:
        - amount
        - currency
        - status
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paymentDate:
          type: string
          format: date-time
    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paymentDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - FAILED
        - CANCELLED
