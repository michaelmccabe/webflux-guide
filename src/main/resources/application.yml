spring:
  application:
    name: reactive-guide
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/paymentdb
    username: postgres
    password: password
    pool:
      initial-size: 5
      max-size: 20
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    root: INFO
    org.springframework.r2dbc: DEBUG
    com.example.reactiveguide: DEBUG

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

